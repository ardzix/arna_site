[supervisord]
nodaemon=true
loglevel=info

[unix_http_server]
file=/tmp/site-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/site-supervisor.sock

[program:uwsgi]
; Increase buffer sizes to handle large Authorization/Cookie headers
; and prevent "invalid request block size" (502) at reverse proxy.
command=/bin/sh -c "uwsgi --http :8001 --module config.wsgi:application --master --processes 4 --threads 2 --buffer-size 65535 --http-buffer-size 65535 --harakiri 60 --max-requests 1000"
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qcluster]
command=python manage.py qcluster
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
